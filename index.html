<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saathi · Elder care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, plain, reassuring — a companion, not a hospital
   IDEA: the parent's own WhatsApp + the family's health folder + a daily status board
   PICTURE: a real-looking WhatsApp phone; a printable health record; a status-first summary
   COLOUR+TYPE: marigold + deep indigo; WhatsApp greens inside the phone; Atkinson Hyperlegible (built for low vision)
   LAYOUT: phone + "what Saathi noted"; memo-style record; board with daily/weekly toggle; simple settings forms */
:root{color-scheme:light dark;--bg:light-dark(#fffcf6,#13161b);--card:light-dark(#fff,#1c2027);--ink:light-dark(#17202b,#eef1f5);--mute:light-dark(#5b6573,#9aa4b2);--line:light-dark(#ebe4d6,#2c323b);--sun:#f2a516;--sunBg:light-dark(#fff3d6,#3a2d10);--blue:light-dark(#1e3a5f,#9dbde6);--blueBg:light-dark(#e9eff7,#1d2838);--red:light-dark(#b9342a,#ff8f84);--redBg:light-dark(#fbe8e5,#3b1f1c);--ok:light-dark(#2d7650,#83d3a4);--okBg:light-dark(#e5f3ea,#1b3325);
--waHead:light-dark(#008069,#202c33);--waBg:light-dark(#efeae2,#0b141a);--waIn:light-dark(#ffffff,#202c33);--waOut:light-dark(#d9fdd3,#005c4b);--waInk:light-dark(#111b21,#e9edef);--waMute:light-dark(#667781,#8696a0);--waBar:light-dark(#f0f2f5,#1f2c34);--waBtn:#00a884}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:8px 16px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px max(3vw,12px)}
.brand{font-weight:700;font-size:22px;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:50%;background:var(--sun);display:inline-block;box-shadow:inset -5px -5px 0 rgba(0,0,0,.15)}
.who{min-height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;padding:0 10px;margin-right:auto;max-width:220px}
.who option{color:#111}
nav{display:flex;gap:4px;background:rgba(255,255,255,.12);padding:4px;border-radius:16px;flex-wrap:wrap}
nav a{color:#fff;text-decoration:none;padding:9px 13px;border-radius:12px;font-weight:700;min-height:44px;display:flex;align-items:center;white-space:nowrap}
nav a[aria-current]{background:var(--sun);color:#2a1c00}
main{max-width:1120px;margin:0 auto;padding:24px max(3vw,12px) 60px}
h1{font-size:clamp(30px,4.4vw,42px);line-height:1.05;margin:0 0 6px;text-wrap:balance}
h2{font-size:21px;margin:28px 0 12px}
h3{font-size:18px;margin:18px 0 8px}
.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.tag{display:inline-block;font-size:14px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--blueBg);color:var(--blue);white-space:nowrap}
.tag.red{background:var(--redBg);color:var(--red)}.tag.ok{background:var(--okBg);color:var(--ok)}.tag.amber{background:var(--sunBg);color:light-dark(#8a5a00,#ffcf6b)}
.primary{background:var(--blue);color:#fff;border:0;font-weight:700}
.danger{color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.muted{color:var(--mute)}
.small{font-size:14px}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=tel],input[type=email],select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--bg);font-size:16px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-weight:700;margin:12px 0 4px;font-size:15px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.form .full{grid-column:1/-1}
.seg{display:inline-flex;background:var(--blueBg);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;min-height:40px;font-weight:700;color:var(--blue)}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff}

/* phone */
.stage{display:grid;grid-template-columns:390px minmax(0,1fr);gap:28px;align-items:start}
.phone{width:100%;max-width:390px;height:min(760px,calc(100vh - 110px));min-height:560px;border-radius:38px;border:10px solid #111;background:var(--waBg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px -20px rgba(0,0,0,.45);color:var(--waInk);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
.wa-top{background:var(--waHead);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px}
.wa-av{width:40px;height:40px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-weight:700;color:#2a1c00;flex:none}
.wa-top b{display:block;font-size:17px}.wa-top small{opacity:.85;font-size:13px}
.wa-chat{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px}
.wa-day{align-self:center;background:var(--waIn);color:var(--waMute);font-size:12.5px;padding:4px 10px;border-radius:8px;margin:4px 0}
.m{max-width:86%;padding:7px 9px 5px;border-radius:9px;box-shadow:0 1px .5px rgba(0,0,0,.13);font-size:16px;line-height:1.38}
.m.in{background:var(--waIn);align-self:flex-start;border-top-left-radius:2px}
.m.out{background:var(--waOut);align-self:flex-end;border-top-right-radius:2px}
.m .t{display:block;text-align:right;font-size:11.5px;color:var(--waMute);margin-top:2px;white-space:nowrap}
.m.out .t::after{content:" ✓✓";color:#53bdeb}
.m img{display:block;width:220px;max-width:100%;border-radius:6px;margin-bottom:4px}
.m .big{font-size:34px;line-height:1}
.m.urgent{background:light-dark(#ffe1dc,#5a1f1a)}
.qr{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.qr button{min-height:38px;border-radius:18px;border:1px solid var(--waBtn);color:var(--waBtn);background:transparent;padding:4px 14px;font-weight:600;font-size:15px}
.voice{display:flex;align-items:center;gap:8px;min-width:190px}
.voice .pl{width:32px;height:32px;min-height:32px;border-radius:50%;background:var(--waBtn);color:#fff;display:grid;place-items:center;font-size:12px;flex:none;border:0;padding:0}
.voice .wv{flex:1;height:22px;background:repeating-linear-gradient(90deg,var(--waMute) 0 2px,transparent 2px 5px);opacity:.6;clip-path:polygon(0 40%,8% 10%,16% 55%,24% 0,32% 45%,40% 20%,48% 60%,56% 5%,64% 50%,72% 25%,80% 70%,88% 30%,100% 50%,100% 100%,0 100%)}
.tr{font-size:13.5px;color:var(--waMute);font-style:italic;margin-top:4px}
.typing{color:var(--waMute);font-style:italic;font-size:14px}
.wa-bar{display:flex;gap:8px;align-items:center;padding:8px;background:var(--waBar)}
.wa-bar input{flex:1;min-height:44px;border:0;border-radius:22px;padding:0 16px;background:var(--waIn);color:var(--waInk);font-size:16px}
.wa-ic{width:46px;height:46px;min-height:46px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;background:transparent;color:var(--waMute);flex:none}
.wa-mic{background:var(--waBtn);color:#fff}
.wa-mic.on{background:#e53935;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.side h2:first-child{margin-top:0}
.ctrl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ctrl button{text-align:left;font-weight:700;font-size:15px}
.noted{display:grid;gap:8px;max-height:380px;overflow-y:auto}
.note{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:12px;padding:10px 12px;font-size:15px}
.note.red{border-left-color:var(--red)}.note.amber{border-left-color:var(--sun)}.note.ok{border-left-color:var(--ok)}
.note time{color:var(--mute);font-size:13px;margin-right:6px}

/* summary */
.status{border-radius:24px;padding:22px;margin-bottom:18px}
.status.red{background:var(--redBg)}.status.amber{background:var(--sunBg)}.status.ok{background:var(--okBg)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.kpi span{color:var(--mute);font-size:14px}
.kpi b{display:block;font-size:clamp(24px,3.2vw,30px);line-height:1.15;white-space:nowrap}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.item.hl{background:var(--sunBg);border-color:transparent}
.item.overdue{background:var(--redBg);border-color:transparent}
.dot{width:12px;height:12px;border-radius:50%;background:var(--mute)}.dot.red{background:var(--red)}.dot.amber{background:var(--sun)}.dot.ok{background:var(--ok)}
.item time{color:var(--mute);font-size:14px;white-space:nowrap}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.meal{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.meal img,.meal .ph{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--blueBg);display:grid;place-items:center;font-size:26px}
.rules{margin:4px 0 0;padding:0;list-style:none;font-size:14.5px}
.rules li::before{content:"✓ ";color:var(--ok);font-weight:700}
.rules li.x::before{content:"✗ ";color:var(--red)}
.week{width:100%;border-collapse:collapse}
.week td,.week th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
.week td.n,.week th.n{text-align:right;white-space:nowrap}
.pips{display:flex;gap:4px;flex-wrap:wrap}.pip{width:14px;height:14px;border-radius:4px;background:var(--line)}.pip.good{background:var(--ok)}.pip.okay{background:var(--sun)}.pip.poor{background:var(--red)}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:10px;align-items:center;margin:6px 0}
.hbar .tr2{height:14px;border-radius:7px;background:var(--line);overflow:hidden}.hbar .fl{height:100%;background:var(--red);border-radius:7px}
.ai{white-space:pre-wrap;background:var(--sunBg);border-radius:16px;padding:14px 16px;margin-top:10px}

/* record */
.memo{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:clamp(18px,4vw,40px)}
table{width:100%;border-collapse:collapse;margin:6px 0 14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:14px;color:var(--mute);font-weight:700}
td.n{text-align:right;white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 18px;margin:8px 0}
.facts div span{display:block;color:var(--mute);font-size:14px}
details.add{margin:4px 0 16px}
details.add summary{cursor:pointer;font-weight:700;color:var(--blue);min-height:44px;display:flex;align-items:center}
.inline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;align-items:end}

/* settings */
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:8px}
.ovc{text-align:left;display:block;width:100%;border-radius:18px;padding:14px 16px;border:2px solid transparent;background:var(--card);box-shadow:0 1px 0 var(--line)}
.ovc.red{background:var(--redBg)}.ovc.amber{background:var(--sunBg)}.ovc.ok{background:var(--okBg)}
.ovc[aria-current]{border-color:var(--blue)}
.ovc b{font-size:20px}.ovc .st{display:block;font-weight:700;margin:2px 0 8px}
.ovc .mini{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--mute)}.ovc .mini span b{font-size:15px;color:var(--ink)}
.ins{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.insc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.insc span{color:var(--mute);font-size:14px;display:block}.insc b{font-size:18px;display:block;margin:2px 0 4px}
.scan{background:var(--blueBg);border-radius:18px;padding:16px;margin:0 0 18px}
.scan h3{margin-top:0}.found{background:var(--card);border-radius:14px;padding:14px;margin-top:10px}
.found ul{margin:4px 0 10px;padding-left:20px}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mem{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:block;width:100%}
.mem[aria-current]{border-color:var(--sun)}
.mem b{font-size:19px;display:block}

dialog{border:0;border-radius:22px;padding:22px;max-width:460px;width:92vw;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.chk{display:flex;gap:8px;align-items:center;font-weight:400}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;z-index:20}
#toast.show{opacity:1}
.demo{font-size:13px;color:var(--mute);margin-top:30px}
.printonly{display:none}
.sm{display:none}
@media(max-width:700px){header{padding:8px 10px;gap:8px}.brand{font-size:19px}.who{flex:1;max-width:none;margin-right:0}nav{width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}nav a{flex:1 0 auto;min-width:auto;justify-content:center;padding:8px 10px;font-size:15px}.lg{display:none}.sm{display:inline}main{padding-top:16px}.status{padding:16px}.status h1{font-size:26px}.phone{height:min(640px,calc(100vh - 140px));border-width:6px;border-radius:28px}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}.wa-mic.on{animation:none}}
@media(max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}.phone{margin:0 auto}}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.form{grid-template-columns:minmax(0,1fr)}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.inline{grid-template-columns:minmax(0,1fr)}.ctrl{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mute)}.stack td:empty{display:none}.stack td.n,.week.stack td.n{text-align:start}}
@media print{header,.noprint,.demo,#toast{display:none!important}body{background:#fff;color:#000;font-size:12pt}main{max-width:none;padding:0}.memo{border:0;padding:0}.printonly{display:block}.tag{border:1px solid #999;background:none!important;color:#000!important}h2{break-after:avoid}table{break-inside:auto}tr{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <div class="brand"><i></i>Saathi</div>
  <select class="who" id="who" aria-label="Family member" title="Switch family member"></select>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<input type="file" id="photoFile" accept="image/*" hidden>
<input type="file" id="docFile" accept="image/*" hidden>
<div id="toast" role="status"></div>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return dkey(d)};
const inDays=n=>ago(-n);
const today=()=>dkey(new Date());
const toMin=t=>{const[h,m]=String(t||'00:00').split(':').map(Number);return h*60+(m||0)};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const hhmm=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const shift=(t,n)=>{const m=toMin(t)+n;return pad(Math.floor(m/60)%24)+':'+pad(m%60)};
const fmtD=k=>new Date(k+'T12:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const dayLabel=k=>new Date(k+'T12:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric'});
const daysTo=k=>Math.round((new Date(k+'T12:00')-new Date(today()+'T12:00'))/864e5);
const uid=()=>Math.random().toString(36).slice(2,8);
const LANGS={'kn-IN':'Kannada','hi-IN':'Hindi','ta-IN':'Tamil','te-IN':'Telugu','en-IN':'English'};
const slotNow=()=>{const n=nowMin();return n<660?'breakfast':n<960?'lunch':n<1110?'snack':'dinner'};

/* ---------- seed ---------- */
function seedAmma(){
 const meds=[
  {id:'met-am',name:'Metformin 500 mg',when:'08:00',note:'after breakfast',for:'sugar',look:'white oval tablet, blue-and-silver strip',left:22,perDay:2},
  {id:'aml',name:'Amlodipine 5 mg',when:'08:00',note:'in the morning',for:'BP',look:'small white round tablet, silver strip',left:4,perDay:1},
  {id:'met-pm',name:'Metformin 500 mg',when:'20:00',note:'after dinner',for:'sugar',look:'white oval tablet, blue-and-silver strip',left:22,perDay:2},
  {id:'ato',name:'Atorvastatin 10 mg',when:'21:30',note:'at bedtime',for:'cholesterol',look:'white round tablet, red strip',left:18,perDay:1}];
 const meal=(slot,t,items,verdict,followed,broke,tip)=>({slot,t,items,verdict,followed,broke,tip});
 const pat=[
  {t:[1,1,1,0],walk:25,mood:'good',meals:[meal('breakfast','09:05','Ragi dosa, coconut chutney','good',['Millets over rice','Protein each meal'],[],'Good fibre start.'),meal('lunch','13:20','Rice, sambar, beans palya, curd','okay',['Half plate vegetables'],['Rice max 1 small cup'],'Rice portion was large.')],ck:[{t:'10:05',text:'Slept well, going to the temple with Shanta',mood:'good',symptoms:[]}]},
  {t:[1,1,1,1],walk:30,mood:'good',meals:[meal('breakfast','08:50','Oats upma, coffee without sugar','good',['No added sugar'],[],'')]},
  {t:[1,0,1,0],walk:10,mood:'low',meals:[meal('snack','17:30','Mysore pak, coffee with sugar','poor',[],['No sweets','No added sugar'],'Festival sweets.'),meal('dinner','20:15','Chapati, dal, palya','good',['Protein each meal','Half plate vegetables'],[],'')],ck:[{t:'11:20',text:'Feeling tired, knees paining',mood:'low',symptoms:['tiredness','knee pain']}]},
  {t:[1,1,1,1],walk:35,mood:'good',meals:[meal('lunch','13:00','Jowar roti, dal, cucumber salad, curd','good',['Millets over rice','Half plate vegetables','Protein each meal'],[],'')]},
  {t:[1,1,0,0],walk:0,mood:'ok',meals:[meal('lunch','13:40','Puliyogare, papad, pickle','poor',[],['Salt under 1 tsp; no pickle/papad','Rice max 1 small cup'],'High salt day.')],ck:[{t:'09:40',text:'Little dizzy in the morning after getting up',mood:'ok',symptoms:['dizziness on standing']}]},
  {t:[1,1,1,0],walk:20,mood:'good',meals:[meal('dinner','20:00','2 chapati, palya, dal','good',['Protein each meal','Half plate vegetables'],[],'')]}];
 const days={};
 pat.forEach((p,i)=>{const doses={};meds.forEach((m,j)=>doses[m.id]=p.t[j]?shift(m.when,8+j*3+i):null);
  days[ago(6-i)]={doses,walk:p.walk,mood:p.mood,meals:p.meals,checkins:p.ck||[],sos:[],pills:[],chat:[],notes:[]}});
 days[today()]={doses:{'met-am':'08:14',aml:null,'met-pm':null,ato:null},walk:10,mood:null,
  meals:[meal('breakfast','08:40','Idli (3), sambar, coconut chutney','okay',['Protein each meal'],['Millets over rice'],'Fine — 3 idlis max.')],checkins:[],sos:[],pills:[],
  notes:[{t:'08:14',lvl:'ok',text:'Metformin 500 mg taken (👍 reply)'},{t:'08:42',lvl:'ok',text:'Breakfast: idli, sambar — okay'}],

async function claude(system,content,json=true,maxTok=1000){
 let r;
 if(S.settings.key){
  r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.settings.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
   body:JSON.stringify({model:S.settings.model,max_tokens:maxTok,system,messages:[{role:'user',content}]})});
 }else if(AI_MODE==='server'){
  r=await fetch('api/claude',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({system,content,max_tokens:maxTok})});
 }else{toast('AI offline — showing a sample reply');return null}
 if(!r.ok)throw new Error('Claude '+r.status+': '+(await r.text()).slice(0,140));
 const j=await r.json();const txt=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
 if(!json)return txt.trim();
 const mm=txt.match(/\{[\s\S]*\}/);try{return JSON.parse(mm?mm[0]:txt)}catch(e){throw new Error('Could not understand the AI reply'+(j.stop_reason==='max_tokens'?' (too long)':''))}
}

function adherence(k,m=M()){const d=m.days[k];if(!d||!m.meds.length)return null;const isT=k===today();
 const due=m.meds.filter(x=>!isT||toMin(x.when)<=nowMin());if(!due.length)return null;
 return Math.round(100*due.filter(x=>d.doses[x.id]).length/due.length)}
function alerts(m=M()){const d=day(today(),m),a=[],n=nowMin();
 d.sos.forEach(s=>a.push({lvl:'red',t:s.t,msg:`${m.call}: “${s.text}”`}));
 d.checkins.forEach(c=>{if(!c.urgent&&c.symptoms?.length)a.push({lvl:'amber',t:c.t,msg:`Mentioned ${c.symptoms.join(', ')}`})});
 m.meds.forEach(x=>{if(!d.doses[x.id]&&n>toMin(x.when)+60)a.push({lvl:'amber',t:x.when,msg:`No 👍 for ${x.name} (${x.for})`})});
 d.pills.forEach(p=>{if(p.wrong)a.push({lvl:'amber',t:p.t,msg:`Tablet mix-up caught: ${p.text}`})});
 d.meals.forEach(ml=>{if(ml.verdict==='poor')a.push({lvl:'amber',t:ml.t,msg:`Poor ${ml.slot}: ${ml.items}`})});
 if(m.pending&&m.pending.from&&m.pending.from!=='you')a.push({lvl:'amber',t:'',msg:`Review the ${m.pending.type||'document'} ${m.pending.from} sent (Health record)`});
 m.tasks.filter(t=>!t.booked&&daysTo(t.due)<0).forEach(t=>a.push({lvl:'amber',t:'',msg:`Overdue: ${t.what}`}));
 const o={red:0,amber:1,grey:2};return a.sort((x,y)=>o[x.lvl]-o[y.lvl])}
function weekStats(m=M()){const ks=last7();
 const meds=m.meds.map(x=>{let due=0,tk=0;ks.forEach(k=>{const d=m.days[k];if(!d)return;if(k===today()&&toMin(x.when)>nowMin())return;due++;if(d.doses[x.id])tk++});return {...x,due,tk,pct:due?Math.round(100*tk/due):0}});
 const meals=[];ks.forEach(k=>(m.days[k]?.meals||[]).forEach(ml=>meals.push({k,...ml})));
 const broke={};meals.forEach(ml=>(ml.broke||[]).forEach(r=>broke[r]=(broke[r]||0)+1));
 const kept={};meals.forEach(ml=>(ml.followed||[]).forEach(r=>kept[r]=(kept[r]||0)+1));
 const syms=[];ks.forEach(k=>(m.days[k]?.checkins||[]).forEach(c=>c.symptoms?.length&&syms.push({k,...c})));
 const walks=ks.map(k=>m.days[k]?.walk||0);
 const v=s=>meals.filter(x=>x.verdict===s).length;
 return {meds,meals,broke,kept,syms,walkAvg:Math.round(walks.reduce((a,b)=>a+b,0)/7),good:v('good'),okay:v('okay'),poor:v('poor')}}
function digest(scope){const m=M();const ks=scope==='day'?[today()]:last7();
 return JSON.stringify({profile:profileText(),days:ks.map(k=>{const{chat,notes,...r}=m.days[k]||{};return{date:k,...r}}),upcoming:m.tasks})}

 if(!r){if(!offline()){m.pending=null;save();const o=$('#scanOut');if(o)o.innerHTML=`<div class="found"><b>Couldn't read this document.</b><br><span class="small">${esc(err||'No reply')}. Try a straighter, brighter photo.</span></div>`;return}r=mockDoc()}
 let thumb=img;try{const im=new Image();im.src=img;await im.decode();const c=document.createElement('canvas'),s=Math.min(1,440/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);thumb=c.toDataURL('image/jpeg',.7)}catch(e){}
 m.pending={...r,img:thumb,from};save()}
function applyDoc(){const m=M(),r=m.pending;if(!r)return;const dt=/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')?r.date:today();
 if(r.meds?.length){const old=m.meds;m.meds=r.meds.map(x=>{const prev=old.find(o=>o.name.toLowerCase()===String(x.name).toLowerCase()&&o.when===x.when)||old.find(o=>o.name.toLowerCase()===String(x.name).toLowerCase());
  return {id:prev&&prev.when===x.when?prev.id:'x'+uid(),name:x.name,when:/^\d{1,2}:\d{2}$/.test(x.when)?x.when.padStart(5,'0'):'23:59',for:x.for||'',note:(/^\d{1,2}:\d{2}$/.test(x.when)?'':'as needed · ')+(x.note||''),look:prev?.look||'',left:prev?.left??30,perDay:prev?.perDay||1}})}
 (r.tests||[]).forEach(x=>m.reports.push({id:uid(),date:dt,name:x.name,value:x.value,ref:x.ref||'',flag:x.flag||'normal'}));
 (r.advice||[]).forEach(a=>{if(!m.diet.rules.includes(a))m.diet.rules.push(a)});
 if(r.type==='prescription')m.appts.push({id:uid(),date:dt,doctor:r.doctor||'Doctor',purpose:'Visit (from scanned prescription)',notes:r.summary||'',done:true});
 if(r.next_visit?.date)m.tasks.push({id:uid(),what:r.next_visit.what||'Follow-up visit',due:r.next_visit.date,booked:false});
 m.tasks=m.tasks.filter(t=>!(r.type==='prescription'&&/review with/i.test(t.what)&&r.doctor&&t.what.includes(r.doctor)&&daysTo(t.due)<30&&!t.booked));
 day().notes.unshift({t:hhmm(),lvl:'ok',text:`${CH()} approved ${r.type} from ${r.doctor||'doctor'} — record updated`});
 if(r.meds?.length)day().chat.push({from:'in',t:hhmm(),text:`📝 ${esc(addressee())}, your tablets were updated after the doctor visit: ${r.meds.map(x=>esc(x.name)+' at '+esc(x.when)).join(', ')}. I'll remind you at the new times 🙏`});
 m.pending=null;save();render();toast('Record updated')}

 let r;try{r=await claude(`${RULES()}\n${profileText()}\nIf the message describes food they ate, judge it against the DOCTOR'S DIET ADVICE and fill "meal". If they ask what to eat, suggest simple Indian home food that fits the advice.\nReturn ONLY JSON: {"reply":"","mood":"good|ok|low","symptoms":["short English labels"],"took_meds":["ids taken/given now"],"walk_minutes":0,"urgent":false,${MEAL_JSON},"note_for_family":"one short English line or empty"}`,text)}catch(e){toast(e.message);r=null}
 busy=false;if(!r&&!offline()){saathiSays('Sorry, I could not process that just now. Please try again 🙏');return}r=r||mockText(text);const d=day();
 (r.took_meds||[]).forEach(id=>medById(id)&&markTaken(id,isVoice?'said in a voice note':'said in chat'));
 if(r.walk_minutes){d.walk+=+r.walk_minutes;note(`Walked ${r.walk_minutes} min`,'ok')}
 if(r.meal)logMeal(r.meal);
 d.checkins.push({t:hhmm(),text,mood:r.mood,symptoms:r.symptoms||[],urgent:!!r.urgent});d.mood=r.mood;
 if(r.urgent){d.sos.push({t:hhmm(),text});note(`URGENT — ${r.symptoms?.join(', ')||'unwell'}. Told to call 108. ${CH()} alerted.`,'red');toast(`🚨 Alert sent to ${CH()}`)}
 else if(r.symptoms?.length)note(`Mentioned ${r.symptoms.join(', ')}`,'amber');
 else if(r.note_for_family)note(r.note_for_family);
 saathiSays(r.reply,r.urgent?{urgent:true}:{})}

async function handlePhoto(file){if(!file)return;

 let thumb=img;try{const im=new Image();im.src=img;await im.decode();const c=document.createElement('canvas'),s=Math.min(1,440/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);thumb=c.toDataURL('image/jpeg',.7)}catch(e){}
 push({from:'out',type:'img',img:thumb});busy=true;render();
 let r;try{r=await claude(`${RULES()}\n${profileText()}\nA photo was sent. Decide if it shows MEDICINE (tablet strip/box/bottle), a MEAL, or a DOCUMENT (any prescription or Rx form — printed, handwritten or a scan; lab report; discharge summary; doctor's note → kind "document": thank them and say ${CH()} will review it; do not interpret doses). When unsure between document and other, choose document.\nMEDICINE: read the label and match it to the MEDICINES list by name/salt (not by looks alone). If it matches, say what it is for, how to take it, and whether it is due now (time has come and not taken yet). If it is NOT on the list, set wrong=true and say clearly NOT to take it and that ${CH()} will check.\nMEAL: name the items (Indian home food), judge against the DOCTOR'S DIET ADVICE — verdict good/okay/poor, which rules were followed or broken (use the exact rule texts), one practical tip.\nReturn ONLY JSON: {"kind":"medicine|meal|document|other","label_read":"","med_id":"id or null","wrong":false,"due_now":false,${MEAL_JSON},"reply":""}`,
  [{type:'image',source:{type:'base64',media_type:'image/jpeg',data:img.split(',')[1]}},{type:'text',text:'Please check this.'}])}catch(e){toast(e.message);r=null}
 busy=false;if(!r&&!offline()){saathiSays("Sorry, I couldn't read that photo. Please send a clearer one 🙏");return}r=r||mockPhoto();const d=day();
 if(r.kind==='medicine'){const x=medById(r.med_id);
  d.pills.push({t:hhmm(),wrong:!!r.wrong,text:r.label_read||'unknown tablet'});
  note(r.wrong?`Tablet check: “${r.label_read}” is NOT on the list — told not to take it`:`Tablet check: ${x?x.name:r.label_read}${r.due_now?' — due now':''}`,r.wrong?'amber':'');
  saathiSays(r.reply,x&&r.due_now&&!d.doses[x.id]?{type:'rem',med:x.id}:{})}
 else if(r.kind==='document'){saathiSays(r.reply||`Thank you! Reading it now — I'll send it to ${CH()} to check 🙏`);busy=true;render();
  await extractDoc(img,addressee());busy=false;const pd=M().pending;
  note(`${addressee()} sent a ${pd?.type||'document'}${pd?.doctor?' from '+pd.doctor:''} — waiting for ${CH()} to approve in Health record`,'amber');
  saathiSays(pd?.type==='lab report'?`Got your report ✅ ${CH()} will check it and share it with the doctor.`:`Got the prescription ✅ ${CH()} will check it, then I'll update your tablet reminders.`)}
 else if(r.kind==='meal'||r.meal){logMeal(r.meal,thumb);saathiSays(r.reply)}
 else saathiSays(r.reply||'Thank you 😊')}

function scheduled(kind){const m=M(),d=day(),who=addressee();
 if(kind==='med'){const pend=new Set(d.chat.filter(x=>x.type==='rem').map(x=>x.med));const x=m.meds.find(y=>!d.doses[y.id]&&!pend.has(y.id))||m.meds.find(y=>!d.doses[y.id]);
  if(!x)return toast('All tablets done for today');
  return saathiSays(`💊 ${who}, time for ${isCare()?m.call+"'s":'your'} ${x.name} (for ${x.for}) — ${x.note}. Reply 👍 once ${isCare()?'given':'taken'}.`,{type:'rem',med:x.id})}
 if(kind==='meal')return saathiSays(`🍽️ ${who}, what did ${isCare()?m.call:'you'} have for ${slotNow()}? Send a photo or a voice note.`);
 if(kind==='how')return saathiSays(isCare()?`🙏 Namaskara ${who}! How is ${m.call} feeling today? Any pain, dizziness or trouble?`:`🙏 Namaskara ${who}! How are you feeling today? You can send me a voice message.`);
 if(kind==='appt'){const t=[...m.tasks].filter(x=>!x.booked).sort((a,b)=>a.due.localeCompare(b.due))[0]||[...m.tasks].sort((a,b)=>(a.booked||a.due).localeCompare(b.booked||b.due))[0];
  if(!t)return toast('No appointments or tests pending');
  return saathiSays(/fasting|test|hba1c|lipid/i.test(t.what)?`🧪 ${who}, ${t.what} is coming up (${fmtD(t.booked||t.due)}). No food after 10 pm the night before — water is fine. ${CH()} will confirm the time.`:`📅 ${who}, ${t.what} is due on ${fmtD(t.booked||t.due)}. Please keep the old reports and the tablet strips ready.`)}
 if(kind==='guide'){const plan=m.meds.map(x=>`• ${x.when} — ${x.name} (${x.note})`).join('\n');
  return saathiSays(`🧭 Today's plan for ${m.call}, ${who}: ${plan.replace(/\n/g,' ')} • Walk ${m.walkGoal} min${m.guidance?' • '+m.guidance:''}`,{})}
 if(kind==='ask'){$('#msg').value=isCare()?`${m.call} is asking which tablet to give now`:'Which tablet should I take now?';handleText($('#msg').value,false);$('#msg').value=''}}

/* ---------- other actions ---------- */
let rec=null,listening=false;
function toggleMic(btn){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)return toast('Voice needs Chrome — type instead');
 if(listening){rec&&rec.stop();return}
 rec=new SR();rec.lang=M().lang;rec.interimResults=true;rec.continuous=false;let said='';
 rec.onresult=ev=>{said=Array.from(ev.results).map(x=>x[0].transcript).join(' ');const i=$('#msg');if(i)i.value=said};
 rec.onend=()=>{listening=false;$('#mic')?.classList.remove('on');const t=said.trim();if(t){$('#msg').value='';handleText(t,true)}};
 rec.onerror=ev=>toast('Mic: '+ev.error);
 try{rec.start();listening=true;btn.classList.add('on');toast('Listening… tap 🎤 again to stop')}catch(e){toast('Mic unavailable')}}
async function brief(){const o=$('#briefOut');o.innerHTML='<div class="ai">Reading the logs…</div>';let t;
 try{t=await claude(`You brief ${CH()} about their ${M().relation.toLowerCase()||'parent'} ${M().call}. Plain English, exactly 4 bullet lines starting with "•": ${sumScope==='day'?"today's tablets, today's food judged against the doctor's diet advice (be specific), anything needing attention, a suggested opening line for a phone call":"tablet adherence pattern (name the weakest dose), food vs the doctor's diet advice (most broken rule, with counts), activity and symptoms, and the next appointment/test to book"}. No diagnosis, no medicine changes — suggest asking the doctor instead.`,digest(sumScope),false)}catch(e){toast(e.message)}
 o.innerHTML=`<div class="ai">${esc(t||mockBrief(sumScope))}</div>`}
async function famBrief(){const o=$('#briefOut');o.innerHTML='<div class="ai">Reading everyone\'s week…</div>';let t;
 const data=JSON.stringify(S.members.map(m=>({who:m.call,relation:m.relation,conditions:m.conds,status:statusOf(m),alerts:alerts(m).map(a=>a.msg),week:(({meds,good,okay,poor,broke,walkAvg,syms})=>({meds:meds.map(x=>x.name+' '+x.pct+'%'),good,okay,poor,broke,walkAvg,symptoms:syms.map(s=>s.symptoms)}))(weekStats(m)),pending:m.tasks.filter(t=>!t.booked).map(t=>t.what+' due '+t.due)})));
 try{t=await claude(`You brief ${CH()}, who looks after several elderly family members from another city. Plain English, 4–5 bullet lines starting with "•": who needs attention first and why, the biggest pattern across the family this week (tablets, food vs doctor's advice, walking), what to book or order this week, and one suggested call to make today. No diagnosis, no medicine changes.`,data,false)}catch(e){toast(e.message)}
 o.innerHTML=`<div class="ai">${esc(t||S.members.map(m=>{const s=statusOf(m),i=insights(m)[0];return `• ${m.call}: ${s.text}${s.top?' — '+s.top:''}${i?'. '+i.k+': '+i.v:''}.`}).join('\n'))}</div>`}
async function docNote(){const o=$('#docOut');o.innerHTML='<div class="ai">Drafting…</div>';let t;
 try{t=await claude(`Write a concise note (under 160 words) the family can send to a doctor before a visit: current medicines with 7-day adherence %, recent abnormal reports, symptoms with dates, diet adherence vs the given advice, activity, and 2–3 questions for the doctor. Neutral clinical tone, no diagnosis, end with "(Family-reported log, not a diagnosis.)"`,recordText()+'\n\nRAW:'+digest('week'),false)}catch(e){toast(e.message)}
 o.innerHTML=`<div class="ai" id="docTxt">${esc(t||recordText())}</div>`}
const val=id=>($('#'+id)?.value||'').trim();
function saveMember(){const m=M();
 Object.assign(m,{name:val('fName'),call:val('fCall')||val('fName'),relation:val('fRel'),age:val('fAge'),city:val('fCity'),lang:val('fLang'),blood:val('fBlood'),walkGoal:+val('fWalk')||20,
  conds:val('fConds').split(',').map(s=>s.trim()).filter(Boolean),allergies:val('fAll').split(',').map(s=>s.trim()).filter(Boolean),emergency:val('fEm'),history:val('fHist'),guidance:val('fGuide')});
 m.contact={type:val('fCType'),name:val('fCType')==='caretaker'?(val('fCName')||'Caretaker'):m.name,phone:val('fPhone')};
 m.diet={...m.diet,by:val('fDietBy'),rules:val('fDiet').split('\n').map(s=>s.trim()).filter(Boolean)};
 const old=m.meds;m.meds=val('fMeds').split('\n').map(s=>s.trim()).filter(Boolean).map((line,i)=>{const[p0,p1,p2,p3]=line.split('|').map(s=>(s||'').trim());const prev=old.find(o=>o.name===p0&&o.when===(p1||'08:00'));
  return prev?{...prev,for:p2||prev.for,note:p3||prev.note}:{id:'x'+uid(),name:p0,when:/^\d{1,2}:\d{2}$/.test(p1)?p1.padStart(5,'0'):'08:00',for:p2||'',note:p3||'',look:'',left:30,perDay:1}});
 save();render();toast(`Saved ${m.call}`)}

document.addEventListener('submit',e=>{if(e.target.id!=='bar')return;e.preventDefault();const i=$('#msg');const t=i.value.trim();if(!t||busy)return;i.value='';handleText(t,false)});
document.addEventListener('change',e=>{if(e.target.id==='who'){S.active=e.target.value;save();render()}if(e.target.id==='asVoice'){S.settings.asVoice=e.target.checked;save()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.who){sumWho=b.dataset.who;if(sumWho!=='all')S.active=sumWho;save();render();scrollTo(0,0);return}
 if(b.dataset.mid)S.active=b.dataset.mid;const m=M();
 if(b.dataset.taken){push({from:'out',type:'big',text:'👍'});markTaken(b.dataset.taken,'👍 reply');save();saathiSays(`Well done! Noted ✅`);return}
 if(b.dataset.later){push({from:'out',text:'Later'});saathiSays(`Okay, I'll remind again in 15 minutes ⏰`);return}
 if(b.dataset.play){const x=day().chat[+b.dataset.play];if(x)speak(x.text,x.from==='in'?m.lang:m.lang);return}
 if(b.dataset.sched){scheduled(b.dataset.sched);return}
 if(b.dataset.scope){sumScope=b.dataset.scope;render();return}
 if(b.dataset.order){m.ordered[b.dataset.order]=true;save();render();toast(`Refill ordered (demo) — ${addressee()} will get a WhatsApp when it ships`);return}
 if(b.dataset.book){const t=m.tasks.find(x=>x.id===b.dataset.book);t.booked=daysTo(t.due)<0?inDays(4):t.due;save();render();toast('Marked as booked');return}
 if(b.dataset.tell){const t=m.tasks.find(x=>x.id===b.dataset.tell);day().chat.push({from:'in',t:hhmm(),text:`📅 ${esc(addressee())}, ${esc(t.what)} — ${esc(fmtD(t.booked||t.due))}. ${esc(CH())} is arranging it.`});note(`Told ${addressee()} about: ${t.what}`);save();toast(`Sent to ${addressee()}'s WhatsApp`);return}
 if(b.dataset.pick){S.active=b.dataset.pick;save();render();return}
 switch(b.id){
  case 'clip':$('#photoFile').click();break;
  case 'mic':toggleMic(b);break;
  case 'nudge':{const t=val('nudgeTxt');if(t){day().chat.push({from:'in',t:hhmm(),text:`<b>From ${esc(CH())}:</b> ${esc(t)}`});note(`${CH()} sent: ${t}`);save();toast(`Sent to ${addressee()}'s WhatsApp`)}break}
  case 'brief':brief();break;
  case 'scanDoc':$('#docFile').click();break;
  case 'applyDoc':applyDoc();break;
  case 'dropDoc':M().pending=null;save();render();break;
  case 'famBrief':famBrief();break;
  case 'docAi':docNote();break;
  case 'emailRec':{const to=$('#shareTo').value;location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(`Health summary — ${m.name}, ${m.age}`)}&body=${encodeURIComponent(($('#docTxt')?.textContent?$('#docTxt').textContent+'\n\n':'')+recordText())}`;break}
  case 'printRec':window.print();break;
  case 'copyRec':navigator.clipboard.writeText(recordText()).then(()=>toast('Copied'),()=>toast('Copy blocked'));break;
  case 'addRep':{if(!val('rN'))return toast('Enter the test name');m.reports.push({id:uid(),date:val('rD')||today(),name:val('rN'),value:val('rV'),ref:val('rR'),flag:'normal'});save();render();toast('Report added');break}
  case 'addDoc':{if(!val('dN'))return toast('Enter the doctor\'s name');m.doctors.push({id:uid(),name:val('dN'),spec:val('dS'),place:val('dP'),phone:'',email:val('dE')});save();render();toast('Doctor added');break}
  case 'addAppt':{if(!val('aW'))return toast('Enter what it is');const dt=val('aD')||inDays(7);m.tasks.push({id:uid(),what:val('aW'),due:dt,booked:val('aB')?dt:false});save();render();toast('Added');break}
  case 'addMem':{const n=blankMember();n.call='New member';S.members.push(n);S.active=n.id;save();render();break}
  case 'saveMem':saveMember();break;
  case 'delMem':{S.members=S.members.filter(x=>x.id!==m.id);S.active=S.members[0].id;save();render();toast('Removed');break}
  case 'saveApp':S.settings.child=val('sChild')||'Ajay';S.settings.model=val('sModel')||'claude-sonnet-5-5';S.settings.key=val('sKey');S.settings.speak=$('#sSpeak').checked;save();render();toast('Settings saved');break;
  case 'resetAll':{const keep=S.settings;S=fresh();S.settings=keep;save();render();toast('Demo data reset');break}}
});
$('#photoFile').addEventListener('change',e=>{handlePhoto(e.target.files[0]);e.target.value=''});
$('#docFile').addEventListener('change',e=>{scanDoc(e.target.files[0]);e.target.value=''});
fetch('api/claude').then(r=>r.ok?r.json():null).then(j=>{AI_MODE=j&&j.ok?'server':'offline'}).catch(()=>{AI_MODE='offline'}).finally(render);
setInterval(()=>{if(view()==='summary'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))render()},60000);
render();
}
</script>
</body>
</html>
